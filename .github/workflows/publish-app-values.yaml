name: Bump archetype-backend values

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag (commit SHA) to roll out
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up mise-managed tools
        uses: jdx/mise-action@v4.3.0

      - name: Set image tag in apps-source/values.yaml
        run: |
          yq -i '.image.tag = strenv(IMAGE_TAG)' apps-source/values.yaml
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is a mutable tag: publishing here is the deploy — Flux's
      # archetype-backend-values OCIRepository re-pulls it on its own
      # interval, no git commit against clusters/kind/ needed.
      - name: Push values artifact to GHCR
        id: push
        run: |
          flux push artifact "oci://ghcr.io/${{ github.repository_owner }}/apps/archetype-backend-values:latest" \
            --path="./apps-source" \
            --source="${{ github.server_url }}/${{ github.repository }}" \
            --revision="${{ github.ref_name }}@sha1:${{ github.sha }}" \
            --output json | tee push.json
          echo "digest=$(jq -r '.digest' push.json)" >> "$GITHUB_OUTPUT"
          echo "repository=$(jq -r '.repository' push.json)" >> "$GITHUB_OUTPUT"

      - name: Attest values artifact provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: "${{ steps.push.outputs.repository }}"
          subject-digest: "${{ steps.push.outputs.digest }}"
          push-to-registry: true
