name: Publish Helm chart

on:
  workflow_dispatch:
    inputs:
      chart:
        description: Chart to publish (directory name under charts/)
        required: true
        type: choice
        options:
          - archetype-backend
      version:
        description: Chart version to publish (e.g. 0.2.0)
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up mise-managed tools
        uses: jdx/mise-action@v4.3.0

      - name: Log in to GitHub Container Registry (Helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      # actions/attest-build-provenance's push-to-registry reads standard
      # Docker credentials (~/.docker/config.json), a separate store from
      # Helm's own registry login above — both are needed.
      - name: Log in to GitHub Container Registry (Docker)
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package chart
        run: |
          helm package "charts/${{ inputs.chart }}" \
            --version "${{ inputs.version }}" \
            --app-version "${{ inputs.version }}" \
            --destination .dist

      - name: Push chart to GitHub Packages (OCI)
        id: push
        run: |
          digest=$(
            helm push ".dist/${{ inputs.chart }}-${{ inputs.version }}.tgz" \
              "oci://ghcr.io/${{ github.repository_owner }}/charts" 2>&1 | tee /dev/stderr \
              | grep -oP '^Digest: \K.*'
          )
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest chart provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: "ghcr.io/${{ github.repository_owner }}/charts/${{ inputs.chart }}"
          subject-digest: "${{ steps.push.outputs.digest }}"
          push-to-registry: true
