name: Publish Helm chart

on:
  workflow_dispatch:
    inputs:
      chart:
        description: Chart to publish (directory name under charts/)
        required: true
        type: choice
        options:
          - archetype-backend
      version:
        description: Chart version to publish (e.g. 0.2.0)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up mise-managed tools
        uses: jdx/mise-action@v4.3.0

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Package chart
        run: |
          helm package "charts/${{ inputs.chart }}" \
            --version "${{ inputs.version }}" \
            --app-version "${{ inputs.version }}" \
            --destination .dist

      - name: Push chart to GitHub Packages (OCI)
        run: |
          helm push ".dist/${{ inputs.chart }}-${{ inputs.version }}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"
