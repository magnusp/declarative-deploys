name: Build app image

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: apps-source
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/apps/archetype-backend:${{ github.sha }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/apps/archetype-backend
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
