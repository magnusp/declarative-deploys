# Instance of the archetype-backend chart for the apps-source/ simulated
# application. The chart comes straight from GHCR (OCIRepository/archetype-backend);
# values are static and inline here, mirroring apps-source/values.yaml by hand.
# There is no OCI values artifact or composition step yet — that arrives in tier 3.
#
# Reconciliation happens on Flux's poll interval (10m) rather than being event-driven,
# since there's no ArtifactGenerator/ExternalArtifact watching for changes.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: archetype-backend-demo
  namespace: flux-system
spec:
  targetNamespace: apps
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
      remediateLastFailure: true
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: archetype-backend
  values:
    replicas: 1
    image:
      repository: ghcr.io/magnusp/apps/archetype-backend
      tag: "latest"
      pullPolicy: IfNotPresent
    service:
      port: 8080
      targetPort: 80
