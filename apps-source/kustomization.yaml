# This is the payload published as the archetype-backend-values OCI
# artifact — Flux's kustomize-controller builds it directly from the
# OCIRepository content, turning values.yaml into the ConfigMap that the
# archetype-backend-demo HelmRelease reads via valuesFrom.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: archetype-backend-values
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
