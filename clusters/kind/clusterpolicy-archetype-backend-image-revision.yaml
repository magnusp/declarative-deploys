# Test policy: stamps the archetype-backend-demo Deployment's pod template
# with the org.opencontainers.image.revision label read off its own image's
# OCI config — proof that Kyverno can enrich a Deployment with data that
# only exists on the pushed image, not in its own manifest.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: archetype-backend-image-revision
spec:
  rules:
    - name: annotate-image-revision
      match:
        any:
          - resources:
              kinds:
                - Deployment
              namespaces:
                - default
              names:
                - default-archetype-backend-demo
      context:
        - name: imageData
          imageRegistry:
            reference: "{{ request.object.spec.template.spec.containers[0].image }}"
      mutate:
        patchStrategicMerge:
          spec:
            template:
              metadata:
                annotations:
                  example.com/image-revision: "{{ imageData.configData.config.Labels.\"org.opencontainers.image.revision\" }}"
