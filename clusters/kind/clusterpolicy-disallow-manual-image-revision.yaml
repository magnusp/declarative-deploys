# Platform validation policy: ensures developers cannot manually supply
# or forge the example.com/image-revision annotation on Deployments with invalid values.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-manual-image-revision
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: check-image-revision-authenticity
      match:
        any:
          - resources:
              kinds:
                - Deployment
      preconditions:
        all:
          - key: "{{ request.object.spec.template.metadata.annotations.\"example.com/image-revision\" || '' }}"
            operator: NotEquals
            value: ""
      context:
        - name: imageData
          imageRegistry:
            reference: "{{ request.object.spec.template.spec.containers[0].image }}"
      validate:
        message: "The example.com/image-revision annotation is managed exclusively by platform policies and cannot be forged."
        pattern:
          spec:
            template:
              metadata:
                annotations:
                  example.com/image-revision: "{{ imageData.configData.config.Labels.\"org.opencontainers.image.revision\" || '' }}"
