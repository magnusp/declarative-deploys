# Instance of the archetype-backend chart for the apps-source/ simulated
# application. Its chart and values are composed directly into an ExternalArtifact
# by source-watcher (ArtifactGenerator), providing immediate event-driven reconciliation
# whenever either the chart version or the values artifact changes.
#
# install/upgrade remediation retries are unbounded (-1): with the default
# bounded retry count, a single bad publish (e.g. an image tag that doesn't
# exist yet) permanently stalls the HelmRelease — confirmed live, it stopped
# retrying even as `interval` kept ticking, and a later good publish was
# silently ignored until a manual `flux reconcile` broke it out of Stalled.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: archetype-backend-demo
  namespace: flux-system
spec:
  targetNamespace: default
  install:
    createNamespace: true
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  interval: 10m
  chartRef:
    kind: ExternalArtifact
    name: archetype-backend-demo

