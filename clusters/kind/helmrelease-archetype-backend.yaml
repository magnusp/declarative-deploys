# Instance of the archetype-backend chart for the apps-source/ simulated
# application. Its chart and values are composed directly into an ExternalArtifact
# by source-watcher (ArtifactGenerator), providing immediate event-driven reconciliation
# whenever either the chart version or the values artifact changes.
#
# Remediation strategy: bounded retries (3) with automatic rollback on upgrade failure.
# When a new valid values/chart artifact is published, source-watcher generates
# a new ExternalArtifact revision, which automatically resets failure state and
# triggers a new release upgrade.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: archetype-backend-demo
  namespace: flux-system
spec:
  targetNamespace: default
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
      remediateLastFailure: true
  interval: 10m
  chartRef:
    kind: ExternalArtifact
    name: archetype-backend-demo

