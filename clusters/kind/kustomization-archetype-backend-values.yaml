# Builds the apps-source/ kustomization from the OCI artifact above,
# producing the archetype-backend-values ConfigMap that the
# archetype-backend-demo HelmRelease reads via valuesFrom.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: archetype-backend-values
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: OCIRepository
    name: archetype-backend-values
  path: ./
  prune: true
  targetNamespace: flux-system
